<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0D3339"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SMART OFFICE"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"></head><body>
<title>SMART OFFICE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: floating right-hand navigation panel + working area (RTL). Phone: sticky top bar + bottom tab bar. */
:root{
  --bg:#F1F5F6;--surface:#FFFFFF;--surface2:#F6F9FA;--line:#DAE2E5;--fg:#13262C;--muted:#5A6E75;
  --primary:#0F5C63;--primary-fg:#FFFFFF;--primary-soft:#DFEFEF;--brass:#B7791F;
  --side:#0D3339;--side-fg:#CFE0E2;--side-active:#17525A;
  --good:#1B7F55;--good-soft:#E0F2E9;--warn:#9A5B06;--warn-soft:#FBEED6;--bad:#B93434;--bad-soft:#F9E1E1;--info:#2B64A8;--info-soft:#E1EBF7;
  --shadow:0 1px 2px rgba(10,40,46,.06),0 6px 20px rgba(10,40,46,.06);
  --f-body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',system-ui,sans-serif;--f-disp:'Readex Pro','IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C171B;--surface:#132329;--surface2:#183038;--line:#25404A;--fg:#E3EEF0;--muted:#8FA8AF;
  --primary:#52B6BD;--primary-fg:#06262A;--primary-soft:#173B41;--brass:#E0A64A;
  --side:#091215;--side-fg:#B9CFD2;--side-active:#17383E;
  --good:#52C792;--good-soft:#14382B;--warn:#E8B058;--warn-soft:#3B2D12;--bad:#F08585;--bad-soft:#40191B;--info:#7DB3EE;--info-soft:#172F4B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C171B;--surface:#132329;--surface2:#183038;--line:#25404A;--fg:#E3EEF0;--muted:#8FA8AF;
  --primary:#52B6BD;--primary-fg:#06262A;--primary-soft:#173B41;--brass:#E0A64A;
  --side:#091215;--side-fg:#B9CFD2;--side-active:#17383E;
  --good:#52C792;--good-soft:#14382B;--warn:#E8B058;--warn-soft:#3B2D12;--bad:#F08585;--bad-soft:#40191B;--info:#7DB3EE;--info-soft:#172F4B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;direction:rtl;font-family:var(--f-body);font-size:15px;line-height:1.6;background:var(--bg);color:var(--fg);
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;font-weight:600;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.num{font-family:var(--f-disp);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.sm{font-size:13px}.xs{font-size:12px}
.hide{display:none!important}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}

/* login */
.login-wrap{min-height:calc(100vh - 32px);display:grid;place-items:center}
.login{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:28px;display:grid;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--side);display:grid;place-items:center;color:#fff;flex:none;position:relative}
.logo svg{width:24px;height:24px}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:inherit}
.logo::after{content:"";position:absolute;inset-inline-start:-4px;bottom:-4px;width:12px;height:12px;border-radius:50%;background:var(--brass);border:2px solid var(--surface)}
.brand b{font-family:var(--f-disp);letter-spacing:.12em;font-size:18px;display:block;line-height:1.2}
.brand small{color:var(--muted);font-size:12px}
.hint-box{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.hint-box code{background:rgba(0,0,0,.07);padding:0 5px;border-radius:4px;font-family:var(--f-disp)}

/* shell */
.shell{display:flex;gap:16px;align-items:flex-start}
.side{width:236px;flex:none;position:sticky;top:16px;height:calc(100vh - 32px);background:var(--side);color:var(--side-fg);border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;gap:6px;overflow:auto}
.side .brand{padding:6px 8px 14px}.side .brand b{color:#fff}.side .brand small{color:var(--side-fg);opacity:.7}
.side .logo{background:var(--side-active)}.side .logo::after{border-color:var(--side)}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--side-fg);text-decoration:none;font-size:14px;position:relative}
.nav a svg{width:19px;height:19px;flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--side-active);color:#fff;font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-inline-start:-10px;top:9px;bottom:9px;width:4px;border-radius:4px;background:var(--brass)}
.nav .badge{margin-inline-start:auto;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 7px;line-height:18px;font-family:var(--f-disp)}
.nav .badge.soft{background:rgba(255,255,255,.14)}
.side-foot{margin-top:auto;padding:10px 8px 2px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;display:grid;gap:8px}
.side-foot b{color:#fff;display:block}
.main{flex:1;min-width:0;display:grid;gap:16px}
.top{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 10px;position:sticky;top:max(16px,env(safe-area-inset-top,0px));z-index:30}
.top h2{font-size:17px;white-space:nowrap}
.gsearch{position:relative;flex:1;min-width:0;max-width:460px;margin-inline-start:auto}
.gsearch input{width:100%;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 36px 8px 12px;outline-offset:0}
.gsearch>svg{position:absolute;inset-inline-start:auto;right:10px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.gres{position:absolute;top:calc(100% + 6px);right:0;left:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:60vh;overflow:auto;z-index:40;padding:6px}
.gres h5{margin:8px 8px 2px;font-size:12px;color:var(--muted);font-weight:600}
.gres .it{display:flex;gap:8px;justify-content:space-between;padding:8px;border-radius:8px;cursor:pointer;align-items:center}
.gres .it:hover{background:var(--primary-soft)}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;padding:0}
.icon-btn:hover{background:var(--primary-soft)}
.icon-btn svg{width:19px;height:19px}
.icon-btn .dot{position:absolute;top:-5px;inset-inline-start:-5px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;line-height:18px;text-align:center;font-family:var(--f-disp)}
.menu-btn{display:none}
#view{display:grid;gap:16px;min-width:0}
.bottom{display:none}

/* blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card.flat{box-shadow:none}
.card-h{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:16px}
.page-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-h h1{font-size:22px}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-radius:12px;padding:10px 14px;font-size:14px}
.banner.warn{background:var(--warn-soft);color:var(--warn)}.banner.bad{background:var(--bad-soft);color:var(--bad)}.banner.info{background:var(--info-soft);color:var(--info)}
.banner .btn{margin-inline-start:auto}
.hello{display:grid;gap:4px}
.hello p{margin:0;color:var(--muted)}
.hello .lead{color:var(--fg);font-size:16px}
.kgroup{display:grid;gap:8px}
.kgroup>h4{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.02em}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:2px;min-width:0;text-align:start;cursor:default}
.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--primary)}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi .v{font-family:var(--f-disp);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.3;overflow-wrap:anywhere}
.kpi .v small{font-size:12px;font-weight:500;color:var(--muted)}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.good .v{color:var(--good)}.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}.kpi.main{border-color:var(--primary);background:var(--primary-soft)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.btn{display:inline-flex;align-items:center;gap:6px;justify-content:center;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--primary-soft)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12.5px;font-weight:500;white-space:nowrap;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.new{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.prog{background:var(--primary-soft);color:var(--primary);border-color:transparent}
.pill.wait{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.done{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.stalled,.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;cursor:pointer;white-space:nowrap;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.tab.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.tab .c{font-family:var(--f-disp);font-size:12px;opacity:.85}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.filters .field{min-width:130px;flex:1}
.list{display:grid;gap:8px;container-type:inline-size}
.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;cursor:pointer}
.row:hover{border-color:var(--primary)}
.row .t{font-weight:600;overflow-wrap:anywhere}.row .t .no{font-family:var(--f-disp);color:var(--muted);font-weight:500;font-size:12.5px;margin-inline-end:6px}
.row .sub{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .end{text-align:end;font-family:var(--f-disp);font-variant-numeric:tabular-nums;font-size:14px}
.row .end small{display:block;color:var(--muted);font-family:var(--f-body);font-size:12px}
.row.late{border-inline-start:4px solid var(--bad)}.row.soon{border-inline-start:4px solid var(--brass)}
.row .acts{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;color:var(--muted);padding:28px 12px;border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--fg);margin-bottom:4px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 12px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--surface2);font-weight:600;color:var(--muted);font-size:12.5px;position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surface2)}
td.n,th.n{text-align:end;font-family:var(--f-disp);font-variant-numeric:tabular-nums}
tr.clk{cursor:pointer}tr.clk:hover td{background:var(--primary-soft)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;min-width:60px;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.bar.bad i{background:var(--bad)}.bar.brass i{background:var(--brass)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg.chart .grid{stroke:var(--line);stroke-width:1}
/* forms */
form{display:grid;gap:14px}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.field{display:grid;gap:4px;min-width:0}
.field>label,.lbl{font-size:13px;color:var(--muted);font-weight:500}
.field input,.field select,.field textarea,.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;min-width:0}
.field textarea{min-height:70px;resize:vertical}
.field .help{font-size:12px;color:var(--muted)}
.field .err,.err{color:var(--bad);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;cursor:pointer}
.seg button.on{background:var(--primary);color:var(--primary-fg)}
.fsec{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px;background:var(--surface2)}
.fsec>h4{font-size:14px}
.formerr{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:14px}
.formerr:empty{display:none}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,20,24,.55);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:16px;width:100%;max-width:560px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal.wide{max-width:900px}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-head h3{font-size:17px}
.m-body{padding:18px;overflow:auto;display:grid;gap:16px;align-content:start}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div{min-width:0}.kv small{display:block;color:var(--muted);font-size:12px}.kv b{font-weight:500;overflow-wrap:anywhere}
.fin{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.fin div{background:var(--surface2);border-radius:10px;padding:8px 12px}
.fin small{display:block;color:var(--muted);font-size:12px}.fin b{font-family:var(--f-disp);font-size:16px;font-variant-numeric:tabular-nums}
.tl{display:grid;gap:0}
.tl .ev{display:grid;grid-template-columns:14px 1fr;gap:10px;padding-bottom:12px;position:relative}
.tl .ev::before{content:"";position:absolute;inset-inline-start:6px;top:14px;bottom:-2px;width:2px;background:var(--line)}
.tl .ev:last-child::before{display:none}
.tl .dot{width:12px;height:12px;border-radius:50%;background:var(--primary);margin-top:6px}
.tl .dot.pay{background:var(--good)}.tl .dot.exp{background:var(--bad)}.tl .dot.fol{background:var(--brass)}
.tl .ev small{color:var(--muted);font-size:12px}
.sumbox{background:var(--primary-soft);border-radius:12px;padding:12px 14px;font-size:14px}
.sumbox b{display:block;font-size:12px;color:var(--primary);margin-bottom:2px}
.toast{position:fixed;bottom:calc(88px + env(safe-area-inset-bottom,0px));inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:100;box-shadow:var(--shadow);font-size:14px}
.toast.bad{background:var(--bad);color:#fff}.toast.good{background:var(--good);color:#fff}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chk input{width:20px;height:20px;margin-top:3px;accent-color:var(--primary);flex:none}
.chk.done .tt{text-decoration:line-through;color:var(--muted)}
.chk .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.prio{font-size:12px;padding:0 8px;border-radius:99px}
.prio.h{background:var(--bad-soft);color:var(--bad)}.prio.m{background:var(--warn-soft);color:var(--warn)}.prio.l{background:var(--surface2);color:var(--muted)}
.sugg{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
pre.report{white-space:pre-wrap;background:var(--surface2);border-radius:12px;padding:14px;font-family:var(--f-body);font-size:14px;margin:0;overflow-wrap:anywhere}
#printArea{display:none}
svg.chart .b1{fill:var(--primary)}svg.chart .b2{fill:var(--brass)}svg.chart .b3{fill:var(--bad)}
/* receipt print */
.rcpt{border:2px solid #222;padding:24px;max-width:640px;margin:auto;color:#111;background:#fff;font-size:15px}
.rcpt h2{text-align:center;font-size:22px;margin-bottom:4px}
.rcpt .r{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #999;padding:6px 0}
.rcpt .sig{display:flex;justify-content:space-between;margin-top:36px}

@container (max-width:640px){.row{grid-template-columns:1fr auto}.row>:nth-child(2),.row>:nth-child(3){grid-column:1/-1}}
@media (max-width:900px){
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:min(290px,86vw);height:auto;border-radius:0;z-index:70;transform:translateX(110%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  body.menu-open .side{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(5,20,24,.5);z-index:65}
  .menu-btn{display:grid}
  .gsearch{max-width:none}
  .top h2{display:none}
  .bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));}
  .bottom a{display:grid;justify-items:center;gap:0;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 0;position:relative;cursor:pointer}
  .bottom a svg{width:22px;height:22px}
  .bottom a.on{color:var(--primary);font-weight:600}
  .bottom a.fab span.fabi{width:46px;height:46px;border-radius:50%;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;margin-top:-22px;box-shadow:var(--shadow);border:3px solid var(--surface)}
  body{padding-bottom:84px}
  .row{grid-template-columns:1fr auto}
  .row>:nth-child(2),.row>:nth-child(3){grid-column:1/-1}
  .page-h h1{font-size:19px}
}
@media (max-width:520px){
  .modal{max-height:calc(100vh - 12px);border-radius:16px 16px 0 0;align-self:end}

<script>
'use strict';
/* ================= أدوات عامة ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];

const pd=s=>s.split('-').map(Number);
const addDays=(s,n)=>{const [y,m,d]=pd(s);return dstr(new Date(y,m-1,d+n))};
const diffDays=(a,b)=>{const x=pd(a),y=pd(b);return Math.round((Date.UTC(y[0],y[1]-1,y[2])-Date.UTC(x[0],x[1]-1,x[2]))/864e5)};
const monthStart=s=>s.slice(0,8)+'01';
const monthEnd=s=>{const [y,m]=pd(s);return dstr(new Date(y,m,0))};
const fmtD=s=>s?s.split('-').reverse().join('/'):'—';
const nowISO=()=>new Date().toISOString();
const fmtDT=iso=>{if(!iso)return '—';const d=new Date(iso);return fmtD(dstr(d))+' '+p2(d.getHours())+':'+p2(d.getMinutes())};
const num=n=>Math.round((+n||0)*100)/100;
const nf=n=>num(n).toLocaleString('en-US');
const money=n=>nf(n)+' ج.م';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const toEn=s=>String(s??'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const numIn=v=>{const x=parseFloat(toEn(v).replace(/[,\s]/g,'').replace('٫','.'));return isNaN(x)?NaN:x};
const normPhone=s=>{let d=toEn(s).replace(/\D/g,'');if(d.startsWith('0020'))d=d.slice(4);else if(d.startsWith('20')&&d.length>=12)d=d.slice(2);if(d.length===10&&d[0]!=='0')d='0'+d;return d};
const normName=s=>String(s||'').replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim().toLowerCase();
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0);
const by=(f,dir=1)=>(a,b)=>{const x=f(a),y=f(b);return (x>y?1:x<y?-1:0)*dir};
const ROLES={owner:'مالك النظام',admin:'المدير',employee:'موظف مكتب',accountant:'محاسب',rep:'مندوب'};
const ST=[

 {k:'ready',n:'جاهز للتنفيذ',g:'prog'},{k:'doing',n:'جاري التنفيذ',g:'prog'},{k:'gov',n:'انتظار جهة حكومية',g:'wait'},
 {k:'client',n:'انتظار العميل',g:'wait'},{k:'done',n:'مكتمل وجاهز للتسليم',g:'done'},{k:'delivered',n:'تم التسليم',g:'done'},

 admin:['*'],

/* كتالوج الصلاحيات: [المفتاح، العنوان، توضيح] — المدير يملك الكل دائماً، وغيره حسب ما يحدده المدير لكل موظف */
const PERM_GROUPS=[
 {t:'العملاء',items:[['customers.view','عرض العملاء وبياناتهم'],['customers.edit','إضافة العملاء وتعديل بياناتهم وتسجيل التعاملات']]},

 {t:'الملفات',items:[['cases.view','عرض الملفات'],['cases.all','عرض كل الملفات','بدونها يرى الموظف الملفات المسندة إليه فقط'],['cases.edit','فتح ملف جديد وتعديل بيانات الملف'],['cases.update','تغيير حالة الملف وتسجيل المتابعات']]},
 {t:'المتابعة والمهام',items:[['followups','مركز المتابعة'],['tasks','المهام']]},
 {t:'المستندات',items:[['docs','رفع المستندات وعرضها (للملفات التي يراها)'],['docs.all','عرض كل مستندات المكتب']]},
 {t:'المالية',items:[['price.view','عرض الأسعار والمبالغ المحصلة والمتبقية'],['cost.view','عرض التكاليف والأرباح','يتطلب عرض الأسعار'],['receipts','التحصيلات وإصدار سندات القبض'],['expenses','المصروفات وتسجيلها'],['reports','الحسابات والتقارير']]}
];

let DB=null, ME=null, MODALS=[];
const isAdm=()=>!!ME&&(ME.role==="admin"||ME.role==="owner");

/* ================= التخزين ================= */
const KEY='smartoffice.db.v1', SKEY='smartoffice.snap.v1', MEM={};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return MEM[k]??null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){MEM[k]=v;return false}};
let saveWarned=false, IX={paid:{},cost:{}};
function reindex(){IX={paid:{},cost:{}};DB.receipts.forEach(r=>{if(!r.void)IX.paid[r.caseId]=(IX.paid[r.caseId]||0)+r.amount});DB.expenses.forEach(e=>{if(!e.void&&e.caseId)IX.cost[e.caseId]=(IX.cost[e.caseId]||0)+e.amount})}
function save(){reindex();if(!lsSet(KEY,JSON.stringify(DB))&&!saveWarned){saveWarned=true;toast('تعذّر الحفظ الدائم في هذا المتصفح، والبيانات مؤقتة. صدّر نسخة احتياطية من الإعدادات.','bad')}syNote()}
function snapshot(){try{const t=T();let s=JSON.parse(lsGet(SKEY)||'[]');if(s[0]&&s[0].date===t)return;s.unshift({date:t,data:JSON.stringify(DB)});s=s.slice(0,3);lsSet(SKEY,JSON.stringify(s))}catch(e){}}
const IDB={db:null,mem:new Map(),async open(){if(this.db)return this.db;try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('smartoffice-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('b');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}return this.db},
 async put(k,v){const d=await this.open();if(!d){this.mem.set(k,v);return}await new Promise((res,rej)=>{const t=d.transaction('b','readwrite');t.objectStore('b').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
 async get(k){const d=await this.open();if(!d)return this.mem.get(k);return new Promise((res,rej)=>{const r=d.transaction('b').objectStore('b').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async del(k){const d=await this.open();if(!d){this.mem.delete(k);return}await new Promise(res=>{const t=d.transaction('b','readwrite');t.objectStore('b').delete(k);t.oncomplete=res;t.onerror=res})}};

/* ================= كلمات المرور ================= */
async function hashPw(pw,salt){const s=salt+':'+pw;try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const ch of s)h=((h<<5)+h+ch.charCodeAt(0))|0;return 'x'+h}}

const OWN={salt:'ow8a355d4df3c6',h:'f669a317df87cc989090d2c9dc683dbe2edca08a053c4a9b6a573f91dcab8c58',hx:'x1584753008'};
function ensureOwner(){const o=DB.users.find(u=>u.role==='owner');if(o){o.active=true;return}const ok=!!(window.crypto&&crypto.subtle);DB.users.push({id:'owner0',name:'حمزة ابوزيد',username:'owner',role:'owner',salt:OWN.salt,pw:ok?OWN.h:OWN.hx,active:true,salary:0,phone:''})}
async function migratePw(){if(!DB.demo)return;const M={admin:'100100',sara:'200200',mahmoud:'300300',karim:'400400',nora:'500500'};let ch=false;for(const u of DB.users){const np=M[u.username];if(np&&u.role!=='owner'&&u.pw===await hashPw('1234',u.salt)){u.salt=uid();u.pw=await hashPw(np,u.salt);ch=true}}if(ch)save()}
async function pwTaken(pw,exceptId){for(const x of DB.users){if(x.id!==exceptId&&x.pw===await hashPw(pw,x.salt))return true}return false}
async function mkUser(name,username,role,pw,salary=0,phone=''){const salt=uid();return{id:uid(),name,username,role,salt,pw:await hashPw(pw,salt),active:true,salary,phone}}

/* ================= سجل العمليات والترقيم ================= */
const AKEY='smartoffice.audit.v1',NOISE=new Set(['دخول','خروج','زيارة','عرض','بحث','اختيار من البحث','طباعة','تصدير','نسخ']);let AUD=[],audT=null;
function loadAud(){try{AUD=JSON.parse(lsGet(AKEY)||'[]')}catch(e){AUD=[]}if(!Array.isArray(AUD))AUD=[]}
function flushAud(){clearTimeout(audT);audT=null;lsSet(AKEY,JSON.stringify(AUD))}
function log(action,entity,eid,desc){AUD.unshift({id:uid(),ts:nowISO(),uid:ME?ME.id:null,uname:ME?ME.name:'غير معروف',o:ME&&ME.role==='owner'?1:0,action,entity,eid,desc});if(AUD.length>6000)AUD.length=6000;if(!audT)audT=setTimeout(flushAud,700)}
const audVis=()=>isOwner()?AUD:AUD.filter(x=>!x.o);
const audUsers=()=>[...new Map(audVis().filter(x=>x.uid).map(x=>[x.uid,x.uname])).entries()];
window.addEventListener('beforeunload',()=>{if(audT)flushAud()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&audT)flushAud()});
function nextNo(kind){const y=T().slice(0,4);const k=kind==='case'?'case-'+y:kind;const n=(DB.counters[k]||0)+1;DB.counters[k]=n;const pad=(x,l)=>String(x).padStart(l,'0');return kind==='case'?`F-${y}-${pad(n,4)}`:kind==='cust'?`C-${pad(n,4)}`:kind==='rec'?`R-${pad(n,5)}`:`E-${pad(n,5)}`}

/* ================= الوصول للبيانات ================= */
const user=id=>DB.users.find(u=>u.id===id);
const vUsers=()=>DB.users.filter(u=>u.role!=='owner'||isOwner());
const uName=id=>{const u=user(id);return !u?'—':(u.role==='owner'&&!isOwner())?'إدارة النظام':u.name};
const cust=id=>DB.customers.find(c=>c.id===id);
const cName=id=>cust(id)?.name||'—';
const kase=id=>DB.cases.find(c=>c.id===id);
const liveCases=()=>DB.cases.filter(c=>!c.deleted);
const liveCust=()=>DB.customers.filter(c=>!c.deleted);
const visCases=()=>(can('cases.all')?liveCases():liveCases().filter(c=>c.responsibleId===ME.id||c.followerId===ME.id)).filter(c=>taxOK(cust(c.customerId)||{}));
const paid=c=>IX.paid[c.id]||0;
const costOf=c=>IX.cost[c.id]||0;
const remain=c=>num(c.price-paid(c));

const isLate=c=>G(c).g!=='done'&&(c.status==='stalled'||(c.expectedDate&&c.expectedDate<T())||(c.followDate&&c.followDate<T()));
const lateDays=c=>{const t=T();return Math.max(0,c.expectedDate&&c.expectedDate<t?diffDays(c.expectedDate,t):0,c.followDate&&c.followDate<t?diffDays(c.followDate,t):0)};

const custVisible=c=>c.tax?can('taxclients.view'):can('customers.view');

const curTab=()=>can('taxclients.view')&&(S.cu.tab==='tax'||!can('customers.view'))?'tax':'';
function periodRange(p){const t=T();return p==='today'?[t,t]:p==='week'?[addDays(t,-6),t]:p==='month'?[monthStart(t),monthEnd(t)]:['0000-00-00','9999-99-99']}
const inR=(d,r)=>!!d&&d>=r[0]&&d<=r[1];
const liveRec=()=>DB.receipts.filter(r=>!r.void);
const liveExp=()=>DB.expenses.filter(e=>!e.void);
const treasury=()=>num(DB.settings.openingBalance+sum(liveRec(),r=>r.amount)-sum(liveExp(),e=>e.amount));
function finStats(r){
  const cs=liveCases().filter(c=>c.status!=='cancelled'&&inR(c.openDate,r));
  const rec=liveRec().filter(x=>inR(x.date,r)), ex=liveExp().filter(x=>inR(x.date,r));
  const value=sum(cs,c=>c.price), collected=sum(rec,x=>x.amount);
  const execCost=sum(ex.filter(x=>x.category==='تنفيذ ملفات'),x=>x.amount), opex=sum(ex.filter(x=>x.category!=='تنفيذ ملفات'),x=>x.amount);
  return{value,collected,execCost,opex,net:num(value-execCost-opex),cash:num(collected-execCost-opex),due:sum(liveCases(),c=>remain(c)),n:cs.length,rec,ex}}

/* ================= العمليات ================= */
const fail=m=>({err:m});
function addCustomer(d,exceptId){
  const name=(d.name||'').trim(), phone=normPhone(d.phone), phone2=normPhone(d.phone2);
  if(!name)return fail('اسم العميل مطلوب');
  if(phone.length<8)return fail('رقم الهاتف مطلوب (8 أرقام على الأقل)');
  const others=liveCust().filter(c=>c.id!==exceptId);
  const dup=others.find(c=>[normPhone(c.phone),normPhone(c.phone2)].filter(Boolean).some(p=>p===phone||(phone2&&p===phone2)));
  if(dup){const vis=taxOK(dup);return{err:vis?`رقم الهاتف مسجل للعميل «${dup.name}» (${dup.code}). استخدم العميل نفسه وأضف له ملفاً جديداً.`:'رقم الهاتف مسجل لعميل آخر في النظام.',dup:vis?dup:undefined}}
  const sim=others.find(c=>normName(c.name)===normName(name)&&taxOK(c));
  if(sim&&!d.force)return{warn:`يوجد عميل بنفس الاسم «${sim.name}» (${sim.code}) برقم مختلف. هل هو شخص آخر؟`,dup:sim};
  const cur0=exceptId?cust(exceptId):null;const tax=d.taxf==='1'?d.tax==='1':!!(cur0&&cur0.tax);
  if(tax&&!can('taxclients.edit'))return fail('ليس لديك صلاحية على عملاء الإقرارات الضريبية');
  if(exceptId){const c=cust(exceptId);Object.assign(c,{name,phone,phone2,address:d.address||'',type:d.type||'فرد',source:d.source||'',notes:d.notes||'',tax});log('تعديل','عميل',c.id,`تعديل بيانات العميل ${c.name}`);save();return{ok:true,customer:c}}
  const c={id:uid(),code:nextNo('cust'),name,phone,phone2,address:d.address||'',type:d.type||'فرد',source:d.source||'',createdAt:nowISO(),regDate:d.regDate||T(),notes:d.notes||'',tax,talks:[],by:ME.id};
  DB.customers.push(c);log('إضافة','عميل',c.id,`إضافة العميل ${c.name} (${c.code})`);save();return{ok:true,customer:c}}
function addCase(d){
  const c0=cust(d.customerId);if(!c0)return fail('اختر العميل');
  if(!d.service)return fail('اختر نوع الخدمة');
  const price=numIn(d.price);if(isNaN(price)||price<0)return fail('سعر الخدمة غير صحيح');
  const open=d.openDate||T();
  if(d.expectedDate&&d.expectedDate<open)return fail('تاريخ التسليم المتوقع قبل تاريخ فتح الملف');
  const c={id:uid(),no:nextNo('case'),customerId:c0.id,service:d.service,responsibleId:d.responsibleId||ME.id,followerId:d.followerId||d.responsibleId||ME.id,openDate:open,execType:d.execType||EXEC[0],status:'new',
    nextStep:d.nextStep||'مراجعة المستندات',followDate:d.followDate||addDays(open,1),expectedDate:d.expectedDate||'',closeDate:'',price:num(price),payMethod:d.payMethod||PAYM[0],notes:d.notes||'',
    history:[{ts:nowISO(),status:'new',by:ME.id,note:'فتح الملف'}],follows:[],createdBy:ME.id,createdAt:nowISO(),updatedAt:nowISO()};
  DB.cases.push(c);log('إضافة','ملف',c.id,`فتح الملف ${c.no} (${c.service}) للعميل ${c0.name}`);save();return{ok:true,case:c}}
function editCase(id,d){
  const c=kase(id);const price=numIn(d.price);if(isNaN(price)||price<0)return fail('سعر الخدمة غير صحيح');
  if(price<paid(c)-0.001)return fail(`لا يمكن جعل السعر أقل من المحصل (${money(paid(c))})`);
  if(d.expectedDate&&d.expectedDate<c.openDate)return fail('تاريخ التسليم المتوقع قبل تاريخ فتح الملف');
  Object.assign(c,{service:d.service,responsibleId:d.responsibleId,followerId:d.followerId,execType:d.execType,nextStep:d.nextStep,followDate:d.followDate,expectedDate:d.expectedDate||'',price:num(price),payMethod:d.payMethod,notes:d.notes||'',updatedAt:nowISO()});

function filterCases(f,base){const q=normName(f.q||''),qp=toEn(f.q||'').replace(/\D/g,'');return (base||visCases()).filter(c=>{const cu=cust(c.customerId);
 if(f.status){if(f.status.startsWith('g:')){if(GG(c)!==f.status.slice(2))return false}else if(c.status!==f.status)return false}

 <div id="ex-case" class="${cat==='تنفيذ ملفات'?'':'hide'}">${c?`<input type="hidden" name="caseq" value="${esc(c.no)}"><div class="sumbox"><b>الملف</b>${esc(c.no+' — '+cName(c.customerId))}</div>`:`<div class="field"><label for="exq">الملف المرتبط ${'*'}</label><input id="exq" name="caseq" list="dl-case" autocomplete="off" placeholder="رقم الملف أو اسم العميل"></div>`}</div>
 <div id="ex-emp" class="${cat==='أجور موظفين'?'':'hide'}">${F.s('employeeId','الموظف',empOpts(1),emp)}</div>${F.t('note','ملاحظة',d.note||'')}<div class="formerr"></div><button class="btn primary" type="submit">حفظ المصروف</button></form>`})};
CHG.expCat=(v)=>{$('#ex-case').classList.toggle('hide',v!=='تنفيذ ملفات');$('#ex-emp').classList.toggle('hide',v!=='أجور موظفين')};
FORMS.exp=(d,f)=>{if(!can('expenses'))return;let caseId='';if(d.category==='تنفيذ ملفات'||(d.caseq&&d.caseq.trim())){const c=resolveCase(d.caseq);if(!c&&d.category==='تنفيذ ملفات')return ferr(f,'اختر الملف المرتبط بمصروف التنفيذ');caseId=c?c.id:''}
 const r=addExpense({...d,caseId});if(r.err)return ferr(f,r.err);closeModal();refresh();toast('تم تسجيل المصروف','good')};
/* مهام */
function taskRow(t){const late=!t.done&&t.due<T();const pr={h:['h','عالية'],m:['m','متوسطة'],l:['l','منخفضة']}[t.priority];return `<div class="chk ${t.done?'done':''}"><input type="checkbox" id="tk-${t.id}" data-change="taskDone" data-id="${t.id}" ${t.done?'checked':''} aria-label="تم"><label class="tt" for="tk-${t.id}"><b>${esc(t.title)}</b><div class="sub muted sm">${esc(uName(t.assigneeId))} · موعد ${fmtD(t.due)}${t.caseId?` · <a href="#" data-act="openCase" data-id="${t.caseId}" onclick="return false">${esc(kase(t.caseId)?.no||'')}</a>`:''}</div></label><span class="prio ${pr[0]}">${pr[1]}</span>${late?'<span class="pill bad">متأخرة</span>':''}${isAdm()?`<button class="icon-btn" style="width:30px;height:30px" data-act="delTask" data-id="${t.id}" aria-label="حذف">${ic('trash')}</button>`:''}</div>`}
CHG.taskDone=(v,t)=>{const k=DB.tasks.find(x=>x.id===t.dataset.id);if(!(k.assigneeId===ME.id||k.createdBy===ME.id||isAdm())){toast('لا تملك صلاحية تعديل هذه المهمة','bad');refresh();return}k.done=t.checked;k.doneAt=t.checked?nowISO():'';log(k.done?'إنجاز':'إعادة فتح','مهمة',k.id,`${k.done?'إنجاز':'إعادة فتح'} المهمة ${k.title}`);save();refresh()};
ACT.delTask=d=>{const r=delEntity('task',d.id);if(r.err)return toast(r.err,'bad');refresh();toast('تم حذف المهمة')};
ACT.newTask=d=>{if(!can('tasks'))return;const c=d.id?kase(d.id):null;pushModal({title:'مهمة جديدة',body:()=>`<form data-form="task">${custDL()}${caseDL()}${F.t('title','عنوان المهمة *','','required')}<div class="fg">${can('cases.all')&&ME.role!=='accountant'||isAdm()?F.s('assigneeId','المسند إليه',empOpts(),ME.id):`<input type="hidden" name="assigneeId" value="${ME.id}">`}${F.s('priority','الأولوية',[['h','عالية'],['m','متوسطة'],['l','منخفضة']],'m')}${F.d('due','موعد التسليم',T())}</div>
 ${c?`<input type="hidden" name="caseq" value="${esc(c.no)}"><div class="sumbox"><b>مرتبطة بالملف</b>${esc(c.no+' — '+cName(c.customerId))}</div>`:`<div class="field"><label for="tkq">ربط بملف (اختياري)</label><input id="tkq" name="caseq" list="dl-case" autocomplete="off" placeholder="رقم الملف أو اسم العميل"></div>`}<div class="formerr"></div><button class="btn primary" type="submit">إضافة</button></form>`})};
FORMS.task=(d,f)=>{const c=resolveCase(d.caseq);const r=addTask({...d,caseId:c?c.id:'',customerId:c?c.customerId:''});if(r.err)return ferr(f,r.err);closeModal();refresh();toast('تمت إضافة المهمة','good')};
/* مستندات */
function fsize(n){return n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB'}
function docRow(d){return `<div class="row" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto" data-act="viewDoc" data-id="${d.id}" tabindex="0"><div><div class="t">${esc(d.name)}</div><div class="sub">${esc(d.cat)} · ${fsize(d.size)}</div></div><div class="sub">${d.customerId?esc(cName(d.customerId)):''}${d.caseId?' · '+esc(kase(d.caseId)?.no||''):''}<br>${fmtD(d.date)} · ${esc(uName(d.by))}</div><div class="end">${ic('folder')}</div></div>`}
ACT.newDoc=d=>{if(!can('docs'))return;const c=d.id?kase(d.id):null;pushModal({title:'رفع مستند',body:()=>`<form data-form="doc">${custDL()}${caseDL()}<div class="field"><label for="df">الملفات (صور، PDF، مستندات) *</label><input id="df" type="file" name="files" multiple required accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt"><span class="help">الحد الأقصى 6 ميغابايت للملف الواحد.</span></div>${F.s('cat','التصنيف',DOCC)}
 ${c?`<input type="hidden" name="caseq" value="${esc(c.no)}"><div class="sumbox"><b>مرتبط بالملف</b>${esc(c.no+' — '+cName(c.customerId))}</div>`:`<div class="field"><label for="dq">ربط بملف</label><input id="dq" name="caseq" list="dl-case" autocomplete="off" placeholder="رقم الملف (اختياري)"></div><div class="field"><label for="dc">أو ربط بعميل</label><input id="dc" name="custq" list="dl-cust" autocomplete="off" placeholder="اسم العميل (اختياري)"></div>`}<div class="formerr"></div><button class="btn primary" type="submit">رفع</button></form>`})};
FORMS.doc=async(d,f)=>{const files=[...f.elements.files.files];if(!files.length)return ferr(f,'اختر ملفاً');const c=resolveCase(d.caseq),cu=c?cust(c.customerId):resolveCust(d.custq);if(!c&&!cu)return ferr(f,'اربط المستند بملف أو بعميل');
 if(c&&!visCases().some(x=>x.id===c.id))return ferr(f,'لا تملك صلاحية على هذا الملف');
 const r=await addDocs(files,{cat:d.cat,caseId:c?c.id:'',customerId:cu?cu.id:''});if(r.err)return ferr(f,r.err);closeModal();refresh();toast(`تم رفع ${r.n} مستند`,'good')};
ACT.viewDoc=async d=>{const doc=DB.docs.find(x=>x.id===d.id);log('عرض','مستند',doc.id,`عرض المستند ${doc.name}`);let blob;try{blob=await IDB.get(d.id)}catch(e){}
 let url='';if(blob){try{url=URL.createObjectURL(blob)}catch(e){}}
 const isImg=/^image\//.test(doc.mime),isPdf=doc.mime==='application/pdf';
 pushModal({title:doc.name,wide:true,noFocus:true,onClose:()=>url&&URL.revokeObjectURL(url),body:()=>`<div class="kv"><div><small>التصنيف</small><b>${esc(doc.cat)}</b></div><div><small>العميل</small><b>${esc(cName(doc.customerId))}</b></div><div><small>الملف</small><b>${esc(kase(doc.caseId)?.no||'—')}</b></div><div><small>تاريخ الرفع</small><b>${fmtD(doc.date)}</b></div><div><small>رفعه</small><b>${esc(uName(doc.by))}</b></div><div><small>الحجم</small><b>${fsize(doc.size)}</b></div></div>
 ${!blob?'<div class="banner warn">محتوى هذا المستند غير متوفر في هذا المتصفح (قد يكون رُفع من جهاز آخر).</div>':isImg?`<img src="${url}" alt="${esc(doc.name)}" style="border-radius:10px;border:1px solid var(--line)">`:isPdf?`<iframe src="${url}" title="${esc(doc.name)}" style="width:100%;height:60vh;border:1px solid var(--line);border-radius:10px"></iframe><a class="btn" href="${url}" target="_blank" rel="noopener">فتح في نافذة جديدة</a>`:`<a class="btn" href="${url}" target="_blank" rel="noopener" download="${esc(doc.name)}">${ic('dl')} فتح / تنزيل</a>`}
 ${isAdm()?`<div><button class="btn danger" data-act="delDoc" data-id="${doc.id}">${ic('trash')} حذف المستند</button></div>`:''}`})};
ACT.delDoc=d=>ask('سيُنقل المستند إلى سلة المحذوفات.','حذف',()=>{const r=delEntity('doc',d.id);if(r.err)return toast(r.err,'bad');closeAll();refresh();toast('تم حذف المستند')},true);

/* ================= المتابعة ================= */
const FU=[['today','متابعة اليوم'],['up','المتابعات القادمة'],['late','المتابعات المتأخرة'],['stalled','الملفات المتوقفة'],['client','تنتظر العميل'],['gov','تنتظر جهة حكومية'],['stale','لم تُحدّث منذ فترة']];
function fuList(k){const t=T(),a=visCases().filter(c=>G(c).g!=='done');
 return k==='today'?a.filter(c=>c.followDate===t):k==='up'?a.filter(c=>c.followDate>t).sort(by(c=>c.followDate)):k==='late'?a.filter(c=>c.followDate&&c.followDate<t).sort(by(c=>c.followDate)):k==='stalled'?a.filter(c=>c.status==='stalled'):k==='client'?a.filter(c=>c.status==='client'||c.status==='docs'):k==='gov'?a.filter(c=>c.status==='gov'):a.filter(c=>staleDays(c)>=DB.settings.staleDays).sort(by(c=>-staleDays(c)))}
VIEWS.followups=()=>`<div class="page-h"><h1>مركز المتابعة</h1><span class="muted sm">حدّ «لم تُحدّث» = ${DB.settings.staleDays} أيام</span></div>
 <div class="tabs" role="tablist">${FU.map(([k,l])=>`<button class="tab ${S.fu===k?'on':''}" data-act="fuTab" data-k="${k}" role="tab">${l} <span class="c">${fuList(k).length}</span></button>`).join('')}</div><div class="list" id="vlist">${LISTS.followups()}</div>`;
ACT.fuTab=d=>{S.fu=d.k;refresh()};
LISTS.followups=()=>{const a=fuList(S.fu);if(!a.length)return empty('لا توجد ملفات في هذه القائمة','أحسنت، لا شيء يحتاج متابعة هنا.');
 return a.map(c=>caseRow(c,`${can('cases.update')?`<button class="btn sm primary" data-act="follow" data-id="${c.id}">تسجيل نتيجة / إعادة جدولة</button><button class="btn sm" data-act="snooze" data-id="${c.id}">غداً</button>`:''}${S.fu==='stale'?`<span class="pill">بدون تحديث ${staleDays(c)} يوم</span>`:''}`)).join('')};
VIEWS.overdue=()=>{const a=visCases().filter(isLate).sort(by(c=>-priority(c)));
 return `<div class="page-h"><h1>الملفات المتأخرة</h1><span class="muted sm">${a.length} ملف · مرتبة بالأولوية</span></div>${a.length?`<div class="list">${a.map(c=>caseRow(c,`<span class="sub" style="color:var(--bad)">${esc(whyText(c))}</span>${can('cases.update')?`<button class="btn sm primary" data-act="follow" data-id="${c.id}">تسجيل متابعة</button>`:''}`)).join('')}</div>`:empty('لا توجد ملفات متأخرة','كل الملفات ضمن الجدول المحدد.')}`};
/* المهام */
VIEWS.tasks=()=>{const tabs=[['today','مهام اليوم'],['late','المتأخرة'],['done','المكتملة'],['all','الكل']];
 return `<div class="page-h"><h1>المهام</h1>${can('tasks')?btnAdd('newTask','مهمة جديدة'):''}</div><div class="filters"><div class="tabs" style="flex:1">${tabs.map(([k,l])=>`<button class="tab ${S.tk.tab===k?'on':''}" data-act="tkTab" data-k="${k}">${l} <span class="c">${tkList(k).length}</span></button>`).join('')}</div>
 ${isAdm()?`<div class="field" style="max-width:200px;flex:none"><label for="tke" class="sm muted">الموظف</label><select id="tke" data-change="rflt" data-s="tk.emp"><option value="">كل الموظفين</option>${opt(empOpts(1),S.tk.emp)}</select></div>`:''}</div><div class="list" id="vlist">${LISTS.tasks()}</div>`};
function tkList(k){const t=T();let a=DB.tasks.filter(x=>!x.deleted);if(!isAdm())a=a.filter(x=>x.assigneeId===ME.id||x.createdBy===ME.id);else if(S.tk.emp)a=a.filter(x=>x.assigneeId===S.tk.emp);
 a=k==='today'?a.filter(x=>!x.done&&x.due===t):k==='late'?a.filter(x=>!x.done&&x.due<t):k==='done'?a.filter(x=>x.done):a;return a.sort(by(x=>x.done?1:0)||by(x=>x.due))}
ACT.tkTab=d=>{S.tk.tab=d.k;refresh()};
LISTS.tasks=()=>{const a=tkList(S.tk.tab).sort((x,y)=>(x.done-y.done)||(x.due<y.due?-1:1)||({h:0,m:1,l:2}[x.priority]-{h:0,m:1,l:2}[y.priority]));return a.length?a.map(taskRow).join(''):empty('لا توجد مهام هنا')};

VIEWS.receipts=()=>`<div class="page-h"><h1>التحصيلات</h1>${btnAdd('newRec','تسجيل تحصيل')}</div>
 <div class="card flat"><div class="filters"><div class="field" style="flex:2"><label for="rq">بحث</label><input id="rq" type="search" data-input="flt" data-s="rc.q" value="${esc(S.rc.q)}" placeholder="رقم السند أو العميل أو رقم الملف"></div><div class="field"><label for="rf">من</label><input id="rf" type="date" data-change="flt" data-s="rc.from" value="${S.rc.from}"></div><div class="field"><label for="rt">إلى</label><input id="rt" type="date" data-change="flt" data-s="rc.to" value="${S.rc.to}"></div></div></div><div class="list" id="vlist">${LISTS.receipts()}</div>`;
LISTS.receipts=()=>{const q=normName(S.rc.q);const vis=new Set(visCases().map(c=>c.id));const a=DB.receipts.filter(r=>vis.has(r.caseId)&&(!S.rc.from||r.date>=S.rc.from)&&(!S.rc.to||r.date<=S.rc.to)&&(!q||r.no.toLowerCase().includes(q)||normName(cName(r.customerId)).includes(q)||(kase(r.caseId)?.no||'').toLowerCase().includes(q))).sort(by(r=>r.date+r.ts,-1));
 if(!a.length)return empty('لا توجد تحصيلات','سجّل أول دفعة من الزر أعلاه.');const ok=a.filter(r=>!r.void);
 return `<div class="muted sm">${ok.length} سند · الإجمالي <b class="num">${money(sum(ok,r=>r.amount))}</b></div>`+a.map(r=>`<div class="row" data-act="viewRec" data-id="${r.id}" tabindex="0"><div><div class="t"><span class="no">${r.no}</span>${esc(cName(r.customerId))} ${r.void?'<span class="pill bad">ملغى</span>':''}</div><div class="sub">ملف ${esc(kase(r.caseId)?.no||'')} · ${esc(kase(r.caseId)?.service||'')}</div></div><div class="sub">${fmtD(r.date)}</div><div class="sub">${esc(r.method)} · ${esc(uName(r.by))}</div><div class="end" style="${r.void?'text-decoration:line-through;opacity:.6':''}">${nf(r.amount)}</div></div>`).join('')};
/* المصروفات */
VIEWS.expenses=()=>`<div class="page-h"><h1>المصروفات</h1>${btnAdd('newExp','تسجيل مصروف')}</div>
 <div class="card flat"><div class="filters"><div class="field"><label for="ec">النوع</label><select id="ec" data-change="flt" data-s="ex.cat"><option value="">الكل</option>${opt(EXPC,S.ex.cat)}</select></div><div class="field"><label for="ef">من</label><input id="ef" type="date" data-change="flt" data-s="ex.from" value="${S.ex.from}"></div><div class="field"><label for="et">إلى</label><input id="et" type="date" data-change="flt" data-s="ex.to" value="${S.ex.to}"></div></div></div><div class="list" id="vlist">${LISTS.expenses()}</div>`;
LISTS.expenses=()=>{const a=DB.expenses.filter(e=>(!S.ex.cat||e.category===S.ex.cat)&&(!S.ex.from||e.date>=S.ex.from)&&(!S.ex.to||e.date<=S.ex.to)).sort(by(e=>e.date+e.ts,-1));if(!a.length)return empty('لا توجد مصروفات');const ok=a.filter(e=>!e.void);
 return `<div class="muted sm">${ok.length} مصروف · الإجمالي <b class="num">${money(sum(ok,e=>e.amount))}</b></div>`+a.map(e=>`<div class="row" style="grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto"><div><div class="t"><span class="no">${e.no}</span>${esc(e.category)} ${e.void?'<span class="pill bad">ملغى</span>':''}</div><div class="sub">${esc(e.note||'')}${e.caseId?' · ملف '+esc(kase(e.caseId)?.no||''):''}${e.employeeId?' · '+esc(uName(e.employeeId)):''}</div></div><div class="sub">${fmtD(e.date)} · ${esc(uName(e.by))}</div><div class="end" style="${e.void?'text-decoration:line-through;opacity:.6':''}">${nf(e.amount)} ${isAdm()&&!e.void?`<button class="btn sm danger" data-act="voidExp" data-id="${e.id}">إلغاء</button>`:''}</div></div>`).join('')};

let LASTREP=null;

VIEWS.reports=()=>{const t=S.rp.tab;let body='';LASTREP=null;

/* ================= المزامنة السحابية (Firebase Realtime Database + تشفير AES-GCM على الجهاز) ================= */
const SYNCK='smartoffice.sync.v1',SYNCB='smartoffice.syncbase.v1';
const SY={cfg:null,k:null,ts:0,base:{},busy:false,again:false,t:null,status:'off',last:0,err:'',timer:null,started:false};
const COLS=['users','customers','cases','receipts','expenses','tasks','docs'];
const toB64=u=>{let s='';const c=0x8000;for(let i=0;i<u.length;i+=c)s+=String.fromCharCode.apply(null,u.subarray(i,i+c));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function syLoad(){try{SY.cfg=JSON.parse(lsGet(SYNCK)||'null')}catch(e){SY.cfg=null}
 try{const b=JSON.parse(lsGet(SYNCB)||'null');if(b){SY.base=b.base||{};SY.ts=b.ts||0;SY.last=b.last||0}}catch(e){}}
const sySaveBase=()=>lsSet(SYNCB,JSON.stringify({base:SY.base,ts:SY.ts,last:SY.last}));
function syHash(o){const s=JSON.stringify(o);let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function syBase(db){const m={};COLS.forEach(k=>(db[k]||[]).forEach(x=>m[k+':'+x.id]=syHash(x)));m.settings=syHash(db.settings||{});return m}
const syNorm=()=>{DB.audit=DB.audit||[];DB.docs=DB.docs||[];DB.tasks=DB.tasks||[];DB.counters=DB.counters||{};DB.settings=DB.settings||{};COLS.forEach(k=>DB[k]=DB[k]||[])};
/* مفاتيح التشفير: من «كود المكتب» نشتق مسار التخزين ومفتاح AES. الخادم لا يرى سوى نص مشفّر. */
async function syKeys(){if(SY.k&&SY.k.code===SY.cfg.code)return SY.k;
 if(!(window.crypto&&crypto.subtle))throw new Error('المتصفح لا يدعم التشفير المطلوب (يلزم فتح التطبيق عبر رابط https)');
 const enc=new TextEncoder(),base=await crypto.subtle.importKey('raw',enc.encode(SY.cfg.code),'PBKDF2',false,['deriveKey','deriveBits']);
 const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode('so-id-v1'),iterations:100000,hash:'SHA-256'},base,128);
 const id=[...new Uint8Array(bits)].map(x=>x.toString(16).padStart(2,'0')).join('');
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('so-key-v1'),iterations:100000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
 return SY.k={code:SY.cfg.code,id,key}}
async function syEnc(key,txt){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(txt)));const o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return toB64(o)}
async function syDec(key,s){const u=fromB64(s);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u.slice(0,12)},key,u.slice(12));return new TextDecoder().decode(pt)}
const syUrl=p=>SY.cfg.url.replace(/\/+$/,'')+'/offices/'+p+'.json';
async function syFetch(url,o){const c=new AbortController(),t=setTimeout(()=>c.abort(),25000);try{return await fetch(url,Object.assign({cache:'no-store',signal:c.signal},o||{}))}finally{clearTimeout(t)}}
function syHttp(r){const e=new Error(r.status===401||r.status===403?'رفض الوصول: راجع قواعد Firebase (Rules) كما في الدليل':r.status===404?'رابط قاعدة البيانات غير صحيح':'خطأ من الخادم '+r.status);e.syhttp=1;return e}
function syErrMsg(e){if(e&&e.syhttp)return e.message;if(e&&e.name==='OperationError')return 'كود المكتب غير صحيح أو البيانات تالفة';if(e&&(e.name==='AbortError'||e instanceof TypeError))return 'تعذر الاتصال بالسحابة. تأكد من الإنترنت ومن الرابط';return (e&&e.message)||'خطأ غير معروف'}
const syGAS=()=>/script\.google\.com/.test(SY.cfg.url);
async function syGas(q,body){const r=await syFetch(SY.cfg.url+(q||''),body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body}:{});if(!r.ok)throw syHttp(r);let j;
 try{j=await r.json()}catch(e){const x=new Error('الرابط لا يرد بالشكل المتوقع. تأكد من نشر السكربت بصلاحية «أي شخص» (Anyone) وأنك نسخت الرابط المنتهي بـ /exec');x.syhttp=1;throw x}
 if(j&&j.error){const x=new Error('خطأ من السكربت: '+j.error);x.syhttp=1;throw x}return j}
async function syGetTs(){const k=await syKeys();if(syGAS()){const j=await syGas('?a=ts&id='+k.id);return j.ts||null}const r=await syFetch(syUrl(k.id+'/ts'));if(!r.ok)throw syHttp(r);return await r.json()}
async function syGetAll(){const k=await syKeys();let j;if(syGAS())j=await syGas('?a=get&id='+k.id);else{const r=await syFetch(syUrl(k.id));if(!r.ok)throw syHttp(r);j=await r.json()}if(!j||!j.d)return null;const p=JSON.parse(await syDec(k.key,j.d));return{ts:j.ts,db:p.db,aud:p.aud||[]}}
async function syPut(){const k=await syKeys(),ts=Date.now();const d=await syEnc(k.key,JSON.stringify({db:DB,aud:AUD.slice(0,3000)}));
 if(syGAS())await syGas('',JSON.stringify({id:k.id,ts,d}));else{const r=await syFetch(syUrl(k.id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({ts,d})});if(!r.ok)throw syHttp(r)}SY.ts=ts}
/* دمج ثلاثي: يُقارَن كل سجل بآخر نسخة متزامنة (SY.base). التعديل على جهة واحدة يفوز، وعند التعديل على الجهتين يفوز الأحدث. */
function syMerge(L,R){const O=Object.assign({},R,L),B=SY.base,tsOf=x=>x.updatedAt||x.voidAt||x.doneAt||x.ts||x.createdAt||'';
 const pick=(x,y,key)=>{const hx=syHash(x),hy=syHash(y);if(hx===hy)return x;const b=B[key];if(b===hx)return y;if(b===hy)return x;if(!!x.void!==!!y.void)return x.void?x:y;if(!!x.deleted!==!!y.deleted)return x.deleted?x:y;return tsOf(y)>tsOf(x)?y:x};
 for(const k of COLS){const m=new Map();(R[k]||[]).forEach(y=>m.set(y.id,y));(L[k]||[]).forEach(x=>{const y=m.get(x.id);m.set(x.id,y?pick(x,y,k+':'+x.id):x)});O[k]=[...m.values()]}
 O.settings=pick(L.settings||{},R.settings||{},'settings');
 O.counters=Object.assign({},R.counters||{});Object.entries(L.counters||{}).forEach(([k,v])=>O.counters[k]=Math.max(v,O.counters[k]||0));
 O.demo=!!(L.demo&&R.demo);return O}
function syApplyDB(n){DB=n;syNorm();ensureOwner();reindex();lsSet(KEY,JSON.stringify(DB))}
function syMergeAud(a){if(!a||!a.length)return;const ids=new Set(AUD.map(x=>x.id));AUD=AUD.concat(a.filter(x=>!ids.has(x.id))).sort(by(x=>x.ts,-1)).slice(0,6000);flushAud()}
const syText=()=>({ok:'متزامن'+(SY.last?' · '+fmtDT(new Date(SY.last).toISOString()):''),sync:'جاري المزامنة...',pending:'تغييرات بانتظار الرفع',err:'خطأ في المزامنة: '+SY.err,offline:'غير متصل بالإنترنت',off:'غير مفعّلة'}[SY.status]||'');
function updateSyncBtn(){const b=$('#syncbtn');if(!b)return;if(!SY.cfg){b.className='icon-btn hide';return}if(!b.firstChild)b.innerHTML=ic('cloud');b.className='icon-btn sy-'+SY.status;b.title=syText();b.setAttribute('aria-label',b.title);const i=$('#syinfo');if(i)i.textContent=b.title}
const setSy=s=>{SY.status=s;updateSyncBtn()};
function syNote(){if(!SY.cfg)return;clearTimeout(SY.t);SY.t=setTimeout(()=>syRun(),2500);if(SY.status!=='sync')setSy(navigator.onLine?'pending':'offline')}
async function syRun(force){
 if(!SY.cfg)return;if(SY.busy){SY.again=true;return}
 if(!navigator.onLine){setSy('offline');return}
 SY.busy=true;clearTimeout(SY.t);setSy('sync');let changed=false;
 try{const rts=await syGetTs();let needPush=false;
  if(rts&&(rts!==SY.ts||force)){const rem=await syGetAll();
   if(rem){const before=JSON.stringify(syBase(DB));syApplyDB(syMerge(DB,rem.db));syMergeAud(rem.aud);const after=JSON.stringify(syBase(DB));changed=after!==before;SY.ts=rts;needPush=after!==JSON.stringify(syBase(rem.db))}
   else needPush=true}
  else if(!rts)needPush=true;
  else needPush=JSON.stringify(syBase(DB))!==JSON.stringify(SY.base);
  if(needPush)await syPut();
  SY.base=syBase(DB);SY.last=Date.now();SY.err='';sySaveBase();setSy('ok');
 }catch(e){SY.err=syErrMsg(e);setSy('err')}
 SY.busy=false;
 if(changed&&ME){const m=DB.users.find(u=>u.id===ME.id&&u.active);if(!m){ACT.logout();toast('تم إيقاف حسابك','bad')}else{ME=m;const a=document.activeElement;if(route!=='newcase'&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)))refresh()}}
 if(SY.again){SY.again=false;syRun()}}
function syStart(){if(!SY.cfg)return;updateSyncBtn();syRun();clearInterval(SY.timer);SY.timer=setInterval(()=>{if(!document.hidden)syRun()},45000);
 if(!SY.started){SY.started=true;document.addEventListener('visibilitychange',()=>{if(!document.hidden)syRun()});window.addEventListener('online',()=>syRun())}}
async function syInitialPull(){try{SY.k=null;const rem=await syGetAll();if(!rem)return false;DB=rem.db;syNorm();AUD=rem.aud;flushAud();SY.ts=rem.ts;SY.base=syBase(DB);sySaveBase();return true}catch(e){return false}}
async function syConnect(url,code,mode){url=(url||'').trim().replace(/\/+$/,'');code=(code||'').trim();
 if(!(/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/i.test(url)||/^https:\/\/[^\s/]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(url)))return 'الرابط غير صحيح. المطلوب رابط تطبيق الويب من Google Apps Script وينتهي بـ /exec';
 if(code.length<12)return 'كود المكتب قصير (12 حرفاً على الأقل)';
 const old=SY.cfg;SY.cfg={url,code};SY.k=null;
 try{const rem=await syGetAll();
  if(mode==='replace'){if(!rem){SY.cfg=old;return 'لا توجد بيانات بهذا الكود. تأكد من الكود.'}
   DB=rem.db;syNorm();ensureOwner();reindex();lsSet(KEY,JSON.stringify(DB));AUD=rem.aud;flushAud();SY.ts=rem.ts;SY.base=syBase(DB);SY.last=Date.now();sySaveBase();lsSet(SYNCK,JSON.stringify(SY.cfg));setSy('ok')}
  else{lsSet(SYNCK,JSON.stringify(SY.cfg));SY.ts=0;SY.base={};await syRun(true);if(SY.status==='err'){const m=SY.err;SY.cfg=old;lsSet(SYNCK,JSON.stringify(old));return m}}
 }catch(e){SY.cfg=old;SY.k=null;return syErrMsg(e)}
 syStart();return ''}
const syLinkCode=()=>'SO1.'+toB64(new TextEncoder().encode(JSON.stringify({u:SY.cfg.url,c:SY.cfg.code})));
const syParseLink=s=>{try{s=(s||'').trim();if(s.startsWith('SO1.'))s=s.slice(4);const o=JSON.parse(new TextDecoder().decode(fromB64(s)));return o.u&&o.c?o:null}catch(e){return null}};
function syncCard(){const on=!!SY.cfg;
 return `<section class="card"><div class="card-h"><h3>المزامنة السحابية (فتح البيانات من أي جهاز)</h3></div>`+(on?
 `<p class="muted sm" style="margin-top:0">الحالة: <b id="syinfo">${esc(syText())}</b></p><div class="btns"><button class="btn primary" data-act="syncNow">مزامنة الآن</button><button class="btn" data-act="syCopyLink">${ic('copy')} نسخ كود ربط جهاز جديد</button><button class="btn danger" data-act="syOff">إيقاف المزامنة على هذا الجهاز</button></div><p class="muted sm" style="margin-bottom:0">على الجهاز الجديد: من شاشة الدخول اضغط «ربط هذا الجهاز بمكتب موجود» والصق الكود. الكود سري: من يملكه يقدر يقرأ بيانات المكتب.</p>`:
 `<p class="muted sm" style="margin-top:0">البيانات تُشفَّر على جهازك قبل رفعها، والخادم لا يرى إلا نصاً مشفراً. خطوات التجهيز في ملف README-ar.md (ملف Code.gs داخل المجلد).</p><form data-form="sync">${F.t('url','رابط تطبيق الويب (Google Sheets) — ينتهي بـ /exec','','placeholder="https://script.google.com/macros/s/.../exec" dir="ltr" required')}<div class="field"><label for="syc">كود المكتب السري</label><div style="display:flex;gap:8px"><input id="syc" name="code" dir="ltr" required class="inp" style="flex:1" autocomplete="off"><button type="button" class="btn" data-act="syGen">توليد</button></div><span class="help">احتفظ به في مكان آمن. بدونه لا يمكن فتح البيانات من جهاز آخر.</span></div><div class="formerr" role="alert"></div><button class="btn primary" type="submit">تفعيل المزامنة</button></form>`)+`</section>`}
ACT.syGen=(d,b)=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789',r=crypto.getRandomValues(new Uint8Array(24));b.closest('form').elements.code.value=[...r].map(x=>A[x%A.length]).join('')};
FORMS.sync=async(d,f)=>{if(!isAdm())return;ferr(f,'جاري الاتصال والمزامنة...');const e=await syConnect(d.url,d.code,'merge');if(e)return ferr(f,e);refresh();toast('تم تفعيل المزامنة','good')};
ACT.syncNow=async()=>{await syRun(true);toast(SY.status==='ok'?'تمت المزامنة':'تعذرت المزامنة: '+SY.err,SY.status==='ok'?'good':'bad')};
ACT.syCopyLink=()=>{if(isAdm()&&SY.cfg)copyText(syLinkCode())};
ACT.syOff=()=>ask('سيتوقف هذا الجهاز عن المزامنة وتبقى بياناته عليه كما هي. تقدر تعيد التفعيل لاحقاً.','إيقاف',()=>{SY.cfg=null;SY.k=null;SY.base={};SY.ts=0;lsSet(SYNCK,'null');lsSet(SYNCB,'null');clearInterval(SY.timer);setSy('off');refresh()},true);
ACT.linkDev=()=>pushModal({title:'ربط الجهاز بمكتب موجود',body:()=>`<form data-form="linkdev"><p class="muted" style="margin:0">الصق كود الربط الذي نسخته من إعدادات المزامنة في الجهاز الأول. سيتم استبدال بيانات هذا الجهاز ببيانات المكتب.</p>${F.a('lc','كود الربط','','required dir="ltr"')}<div class="formerr" role="alert"></div><button class="btn primary" type="submit">ربط وتنزيل البيانات</button></form>`});
FORMS.linkdev=async(d,f)=>{const o=syParseLink(d.lc);if(!o)return ferr(f,'الكود غير صحيح');ferr(f,'جاري تنزيل البيانات...');const e=await syConnect(o.u,o.c,'replace');if(e)return ferr(f,e);closeModal();toast('تم الربط وتنزيل البيانات','good');showLogin()};
/* تثبيت التطبيق (PWA) */
let DEFP=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();DEFP=e});
ACT.installApp=async()=>{if(DEFP){DEFP.prompt();try{await DEFP.userChoice}catch(e){}DEFP=null;return}toast('من قائمة المتصفح اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية». على iPhone: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».')};

/* ================= الإقلاع ================= */
(async function boot(){
 document.documentElement.dir='rtl';document.documentElement.lang='ar';applyTheme();loadAud();
 try{const raw=lsGet(KEY);if(raw)DB=JSON.parse(raw)}catch(e){DB=null}
 syLoad();
 if(!DB||!DB.users||!DB.users.length){if(!(SY.cfg&&await syInitialPull()))await seed()}
 DB.audit=DB.audit||[];DB.docs=DB.docs||[];DB.tasks=DB.tasks||[];DB.counters=DB.counters||{};DB.settings=DB.settings||{};
 if(DB.settings.office==='مكتب النخبة للخدمات')DB.settings.office='سمارت اوفيس';
 await migratePw();ensureOwner();
 if(DB.audit.length){const ids=new Set(AUD.map(x=>x.id));AUD=AUD.concat(DB.audit.filter(x=>!ids.has(x.id))).sort(by(x=>x.ts,-1)).slice(0,6000);DB.audit=[];flushAud()}
 document.title=appName();save();snapshot();
 let sid=null;try{sid=sessionStorage.getItem('so.uid')}catch(e){}
 const u=sid&&DB.users.find(x=>x.id===sid&&x.active);if(u)enter(u,false);else showLogin();
 syStart();
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
